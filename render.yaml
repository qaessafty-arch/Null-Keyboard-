# Render Blueprint — deploys NULL-TECH as one Node web service.
# Render terminates HTTPS and supports WebSockets, so the pairing hub (/signal)
# runs unchanged. The server switches to hosted mode from RENDER_EXTERNAL_URL:
# plain HTTP behind the proxy, the public URL in the pairing QR code, and
# per-client rate limits from X-Forwarded-For.
services:
  - type: web
    name: null-tech
    runtime: node
    plan: free
    branch: ccr-b9a5f49f-5ewgay
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/index.ts
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
